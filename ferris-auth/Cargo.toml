[package]
name = "ferris-auth"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
description = "Authentication and authorization for Ferris framework"

[lints]
workspace = true

[dependencies]
ferris-core = { path = "../ferris-core" }
ferris-db = { path = "../ferris-db" }
ferris-document = { path = "../ferris-document" }
ferris-schema = { path = "../ferris-schema" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
argon2 = { version = "0.5", features = ["std"] }
cookie = { version = "0.17", features = ["percent-encoding", "signed"], optional = true }
uuid = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
data-encoding = { workspace = true }
axum = { workspace = true }
axum-login = { workspace = true }
tower-sessions = { workspace = true }
totp-rs = { workspace = true }
# `tower_sessions::session::Record::expiry_date` is a `time::OffsetDateTime` and
# tower-sessions does not re-export `time`, so the session store has to name the
# type to convert it to/from the `BIGINT` expiry column. Already in the locked
# graph through rcgen/tower-sessions; this only makes the edge explicit.
time = { workspace = true }
# OAuth2/OIDC HTTP client. Optional so a deployment that does not use OAuth can
# build `ferris-auth` without `reqwest` and its TLS stack; the `oauth` feature
# is on by default, so existing consumers keep the previous surface.
reqwest = { workspace = true, optional = true }
parking_lot = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
# `url` only parses provider/auth URLs in the OAuth module; optional with it so
# a non-OAuth build does not carry an unused edge.
url = { version = "2.5", optional = true }

[features]
default = ["oauth"]
oauth = ["dep:cookie", "dep:reqwest", "dep:url"]

[dev-dependencies]
wiremock = "0.6"
