[package]
name = "ferris-auth"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
description = "Authentication and authorization for Ferris framework"

[lints]
workspace = true

[dependencies]
ferris-core = { path = "../ferris-core" }
ferris-db = { path = "../ferris-db" }
ferris-document = { path = "../ferris-document" }
ferris-schema = { path = "../ferris-schema" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
jsonwebtoken = { version = "9.3" }
argon2 = { version = "0.5", features = ["std"] }
cookie = { version = "0.17", features = ["percent-encoding", "signed"] }
uuid = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
data-encoding = { workspace = true }
axum = { workspace = true }
axum-extra = { version = "0.12", features = ["cookie", "multipart", "form", "typed-header"] }
reqwest = { workspace = true }
parking_lot = { workspace = true }
hmac = { workspace = true }
sha1 = { version = "0.10" }
sha2 = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
url = { version = "2.5" }
[dev-dependencies]
wiremock = "0.6"
